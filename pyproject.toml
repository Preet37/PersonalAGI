[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personalagi"
version = "0.1.0"
description = "A personal context system: markdown as the source of truth, SQLite FTS5 for retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-frontmatter>=1.1",
    "groq>=0.13",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
personalagi = "personalagi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/personalagi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
